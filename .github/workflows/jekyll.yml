# Build AcademicPage and deploy it to GitHub Pages.
name: Deploy AcademicPage to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master", "main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Monday at 10:00 Asia/Shanghai (02:00 UTC).
  schedule:
    - cron: '0 2 * * 1'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.result.outputs.revision }}
      deploy: ${{ steps.result.outputs.deploy }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Test visitor location updates
        run: node --test scripts/update-visitor-map.test.mjs
      - name: Merge new visitor locations
        id: refresh
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        run: node scripts/update-visitor-map.mjs
      - name: Report refresh failure
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Visitor map refresh failed. The saved locations remain unchanged.'
      - name: Save new visitor locations
        if: steps.refresh.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/data/visitor-map.json
          git commit -m 'chore(map): add new visitor locations'
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Select build revision
        id: result
        env:
          EVENT_NAME: ${{ github.event_name }}
          MAP_CHANGED: ${{ steps.refresh.outputs.changed }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$MAP_CHANGED" = 'true' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  # Build job
  build:
    needs: update-map
    if: needs.update-map.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.update-map.outputs.revision }}
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Pages supplies an empty base path for wangjiale.xyz, or /AcademicPage
        # when the repository is served at the default GitHub Pages URL.
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
