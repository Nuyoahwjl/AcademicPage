<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <script>
    try {
      var preference = localStorage.getItem('theme');
      document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
        ? preference : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) { document.documentElement.dataset.theme = 'light'; }
  </script>
  {% assign asset_version = site.time | date: '%s' %}
  <link rel="icon" type="image/svg+xml" sizes="any" href="{{ '/images/favicon.svg' | relative_url }}?v={{ asset_version }}">
  <link rel="preload" href="{{ '/assets/fonts/InterVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ asset_version }}">
  <script defer src="{{ '/assets/js/navigation.js' | relative_url }}?v={{ asset_version }}"></script>
  <script defer src="{{ '/assets/js/visitor-map.js' | relative_url }}?v={{ asset_version }}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="page-grid header-grid">
      <span class="homepage-brand">Academic Page</span>
      <nav class="section-nav" aria-label="Page sections">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false" title="Switch color theme">
        <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </div>
  </header>
  <div class="page-grid content-grid">
    <aside class="sidebar" aria-label="Personal profile">{% include author-profile.html %}</aside>
    <main id="main-content" tabindex="-1">{{ content }}</main>
  </div>
  <div id="mobile-visitor-map" class="mobile-visitor-map"></div>
</body>
</html>
