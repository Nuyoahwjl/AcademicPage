about: |
  I am currently a senior undergraduate in the <a href="https://cs.hust.edu.cn/"><span class="inline-leading"><img class="inline-icon inline-icon--cs" src="images/icons/hust-cs.png" alt="" aria-hidden="true">School</span> of Computer Science and Technology</a> at <a href="https://www.hust.edu.cn/"><span class="inline-leading"><img class="inline-icon" src="images/icons/hust.png" alt="" aria-hidden="true">Huazhong</span> University of Science and Technology (HUST)</a>, where I am advised by <a class="inline-tool" href="https://qinbinli.com/"><img class="inline-icon inline-icon--portrait" src="images/icons/qinbin-li.jpg" alt="" aria-hidden="true">Prof. Qinbin Li</a>. As I prepare for doctoral study, I am developing my interests at the intersection of intelligent agents and computing systems. In Fall 2027, I will join <a class="inline-tool" href="https://www.zju.edu.cn/english/"><img class="inline-icon" src="images/icons/zju.png" alt="" aria-hidden="true">Zhejiang University</a> to pursue a Ph.D.

  My research interests center on <span class="research-interest">LLM Agents</span>, <span class="research-interest">Systems for AI</span>, <span class="research-interest">Edge–Cloud Collaborative Inference</span>, and <span class="research-interest">AI Infrastructure</span>. I am particularly interested in the systems behind capable agents: how to support their inference efficiently and reliably, and how to coordinate computation across edge devices and cloud resources. More broadly, I hope to connect advances in AI capabilities with the infrastructure needed to make them practical and scalable.

  I also enjoy collaborating with <a class="inline-tool" href="https://github.com/anthropics/claude-code"><img class="inline-icon" src="images/icons/claudecode.png" alt="" aria-hidden="true">Claude Code</a>, <a class="inline-tool" href="https://github.com/openai/codex"><img class="inline-icon" src="images/icons/codex.svg" alt="" aria-hidden="true">Codex</a>, and <a class="inline-tool" href="https://github.com/deepseek-ai/deepseek-harness"><img class="inline-icon" src="images/icons/deepseek-harness.svg" alt="" aria-hidden="true">DeepSeek Harness</a>. I see them as partners for exploring ideas, considering different approaches, and working through coding questions. They are a welcome part of the process of turning an initial idea into something concrete, and I enjoy learning through that collaboration.

