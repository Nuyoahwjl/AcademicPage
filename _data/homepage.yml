about: |
  I am currently a senior undergraduate majoring in <a class="inline-tool" href="https://cs.hust.edu.cn/"><span class="inline-icon inline-icon--cs" aria-hidden="true"><img src="images/icons/hust-cs.png" alt=""></span>Computer Science</a> at <a href="https://www.hust.edu.cn/"><span class="inline-leading"><img class="inline-icon" src="images/icons/hust.png" alt="" aria-hidden="true">Huazhong</span> University of Science and Technology (HUST)</a>, advised by <a class="inline-tool" href="https://qinbinli.com/"><img class="inline-icon inline-icon--portrait" src="images/icons/qinbin-li.jpg" alt="" aria-hidden="true">Prof. Qinbin Li</a>. And I will join <a href="https://www.zju.edu.cn/"><span class="inline-leading"><img class="inline-icon" src="images/icons/zju.png" alt="" aria-hidden="true">Zhejiang</span> University (ZJU)</a> in Fall 2027 to pursue a Ph.D. degree. My research interests include <span class="research-interest">LLM Agents</span>, <span class="research-interest">Systems for AI</span>, <span class="research-interest">Edge–Cloud Collaborative Inference</span>, and <span class="research-interest">AI Infrastructure</span>. In my free time, I enjoy playing <a class="inline-tool" href="https://val.qq.com/main.html"><img class="inline-icon" src="images/icons/valorant.svg" alt="" aria-hidden="true">VALORANT</a> to unwind.

  I also enjoy collaborating with <a class="inline-tool" href="https://github.com/anthropics/claude-code"><img class="inline-icon" src="images/icons/claudecode.png" alt="" aria-hidden="true">Claude Code</a>, <a class="inline-tool" href="https://github.com/openai/codex"><img class="inline-icon" src="images/icons/codex.svg" alt="" aria-hidden="true">Codex</a>, and <a class="inline-tool" href="https://github.com/deepseek-ai/deepseek-harness"><img class="inline-icon" src="images/icons/deepseek-harness.svg" alt="" aria-hidden="true">DeepSeek Harness</a> to explore ideas, refine code, and work through implementation details. They are my trusted partners in learning and research.

